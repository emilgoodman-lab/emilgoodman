<!doctype html><html lang="en"><meta charset="utf-8"><title>Painted Rotor QA</title><style>body{background:#ddd;font:12px monospace}iframe{width:800px;height:700px;border:0}pre{white-space:pre-wrap}button{padding:8px}</style><button id="run">Run input checks</button><button id="mobile">Mobile view</button><button id="fist">Hold fist</button><button id="open">Open hand</button><pre id="result">Loading…</pre><iframe id="art" src="/experiments/rotor/v2/"></iframe><script type="module">
const frame=document.querySelector('#art'),out=document.querySelector('#result'),sleep=ms=>new Promise(r=>setTimeout(r,ms));let errors=[];
frame.onload=()=>{const w=frame.contentWindow,s=frame.contentDocument.createElement('script');s.type='module';s.textContent="import {snapshot} from '/experiments/rotor/v2/main.mjs';window.labSnapshot=snapshot;";frame.contentDocument.body.append(s);w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));out.textContent='Ready';};
const get=()=>frame.contentWindow.labSnapshot(),send=(tracked,fist,x=0,y=0)=>frame.contentWindow.dispatchEvent(new frame.contentWindow.CustomEvent('lab-hand',{detail:{tracked,fist,x,y}}));
document.querySelector('#run').onclick=async()=>{const results=[],check=(n,v)=>results.push((v?'PASS ':'FAIL ')+n),w=frame.contentWindow,c=frame.contentDocument.querySelector('canvas'),key=k=>c.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true}));try{check('28 rings; only one visible button',get().rings===28&&frame.contentDocument.querySelectorAll('button').length===1);send(true,false);await sleep(1200);check('Center combines all four original fields',get().weights.every(v=>v>.97));send(true,true);const fistStart=get().time;for(let i=0;i<40&&get().time-fistStart<.8;i++)await sleep(100);check('Fist intensifies and changes hand icon '+JSON.stringify({stress:get().stress,inverted:get().inverted,closed:get().cursor.closed,elapsed:get().time-fistStart}),get().stress>.95&&get().inverted&&get().cursor.closed);send(true,false);await sleep(700);check('Opening restores calm polarity',!get().inverted&&!get().cursor.closed&&get().stress<.05);send(true,true);send(false,false);check('Lost hand releases',!get().inverted&&!get().cursor.active);key('k');check('Kaleidoscope remains available',get().mirror===1);key('p');let a=get();await sleep(200);check('Pause',get().paused&&get().time===a.time);key('p');await sleep(200);check('Resume',get().time>a.time&&!get().paused);
const capture=c.setPointerCapture;c.setPointerCapture=()=>{};c.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:900,pointerType:'touch',clientX:200,clientY:200}));check('Touch hold',get().inverted&&get().cursor.closed);c.dispatchEvent(new w.PointerEvent('pointercancel',{pointerId:900,pointerType:'touch'}));check('Touch cancel',!get().inverted);c.setPointerCapture=capture;await sleep(200);check('Audio starts',get().audioEnabled&&get().audioState==='running');check('No runtime errors',errors.length===0);out.textContent=results.join('\n')+'\n'+JSON.stringify(get());}catch(e){out.textContent=results.join('\n')+'\nERROR '+e.stack;}};
document.querySelector('#mobile').onclick=async()=>{frame.style.width='390px';frame.style.height='740px';await sleep(400);const d=frame.contentDocument,b=d.querySelector('button').getBoundingClientRect();out.textContent='Mobile button visible: '+(b.right<=390&&b.bottom<=740)+'\nNo overflow: '+(d.documentElement.scrollWidth===390)+'\n'+JSON.stringify(get());};
document.querySelector('#fist').onclick=()=>{send(true,true);setTimeout(()=>{out.textContent='Fist held at center: '+JSON.stringify(get());},1400);};document.querySelector('#open').onclick=()=>send(true,false,.65,-.4);
</script></html>
