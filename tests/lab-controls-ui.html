<!doctype html><meta charset="utf-8"><title>Lab release checks</title><style>body{font:13px monospace}iframe{width:100%;height:650px;border:1px solid}pre{white-space:pre-wrap}</style><button id="catalog">Check all works</button><button id="rotor">Check Rotor interactions</button><button id="mobile">Mobile view</button><pre id="out">Ready</pre><iframe id="view" allow="autoplay; camera" src="/play/?work=rotor"></iframe><script type="module">
import {works} from '/lab/catalog.mjs';
const frame=document.querySelector('#view'),out=document.querySelector('#out');const wait=ms=>new Promise(r=>setTimeout(r,ms));function log(t){out.textContent+='\n'+t;}function check(ok,msg){if(!ok)throw Error(msg);log('PASS '+msg);}async function ready(){for(let i=0;i<100;i++){const d=frame.contentDocument;if(d&&!d.querySelector('#loading')&&d.querySelector('iframe')?.contentDocument?.querySelector('canvas'))return;await wait(100);}throw Error('Load timeout');}
document.querySelector('#mobile').onclick=()=>{frame.style.width='390px';frame.style.height='740px';};
document.querySelector('#catalog').onclick=async()=>{out.textContent='Checking catalog';try{for(const work of works){frame.src='/play/?work='+work.id;await wait(100);await ready();const d=frame.contentDocument,w=d.querySelector('iframe').contentWindow;check(d.querySelector('#next').href.includes('work=')&&d.querySelector('#previous').href.includes('work='),work.id+' navigation');check(d.querySelector('#camera-toggle')&&!d.querySelector('#camera-toggle').disabled,work.id+' webcam control');if(work.audio){let state;w.addEventListener('lab-audio-state',e=>state=e.detail);w.dispatchEvent(new w.Event('lab-audio-query'));check(state!==undefined,work.id+' audio ready');w.dispatchEvent(new w.CustomEvent('lab-audio-command',{detail:{volume:.3,enabled:false}}));await wait(50);check(state.volume===.3&&!state.enabled,work.id+' volume + mute');}else check(d.querySelector('#lab-sound').disabled,'silent work indicated');}log('CATALOG COMPLETE');}catch(e){log('FAIL '+e.message);}};
document.querySelector('#rotor').onclick=async()=>{out.textContent='Checking Rotor';try{frame.src='/play/?work=rotor';await wait(100);await ready();const d=frame.contentDocument,w=d.querySelector('iframe').contentWindow,doc=w.document;const s=doc.createElement('script');s.type='module';s.textContent="import {snapshot} from '/experiments/rotor/v5/main.mjs';window.qaSnapshot=snapshot";doc.body.append(s);for(let i=0;i<50&&!w.qaSnapshot;i++)await wait(100);const snap=()=>w.qaSnapshot();check(snap().rings===14,'14 rings');check(snap().swimmerFrames.flat().every(x=>x===snap().swimmerFrames[0][0]),'initial sync');frame.contentWindow.dispatchEvent(new frame.contentWindow.CustomEvent('lab-hand',{detail:{tracked:true,x:0,y:-.75,fist:true}}));await wait(3500);check(snap().inverted&&snap().hand,'shared fist forwarded');check(snap().delayMix>.6&&new Set(snap().swimmerFrames.flat()).size>1,'top zone separates GIF phases');frame.contentWindow.dispatchEvent(new frame.contentWindow.CustomEvent('lab-hand',{detail:{tracked:false,fist:false}}));check(!snap().inverted,'lost hand releases');doc.querySelector('#pause').click();const t=snap().time;await wait(200);check(snap().paused&&snap().time===t,'pause freezes animation');doc.querySelector('#pause').click();await wait(200);check(snap().time>t,'resume');const c=doc.querySelector('#rings');c.setPointerCapture=()=>{};c.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:10,pointerType:'touch',clientX:100,clientY:200}));check(snap().inverted,'touch hold');c.dispatchEvent(new w.PointerEvent('pointercancel',{pointerId:10,pointerType:'touch'}));check(!snap().inverted,'touch cancel');frame.style.width='390px';frame.style.height='740px';await wait(400);check(d.documentElement.scrollWidth<=390,'mobile toolbar fits');log('ROTOR COMPLETE');}catch(e){log('FAIL '+e.stack);}};
</script>
