<!doctype html><html><meta charset="utf-8"><title>Painted Rotor audio</title><pre id="result">Rendering modulated instruments…</pre><script type="module">
import {RotorAudio} from '/experiments/rotor/v2/audio.mjs';const Native=window.AudioContext;
class TestContext extends OfflineAudioContext{constructor(){super(2,44100*4,44100);this.scheduleTime=0;}get state(){return 'running';}get currentTime(){return this.scheduleTime;}resume(){return Promise.resolve();}}
window.AudioContext=TestContext;
try{const results=[];for(const [name,weights,stress] of [['CALM',[0,0,0,0],0],['DEPTH',[1,0,0,0],0],['MODULATION',[0,1,1,1],0],['FIST',[1,1,1,1],1]]){const audio=new RotorAudio();await audio.enable();for(let i=0;i<40;i++){audio.ctx.scheduleTime=i*.1;audio.update({time:i*.1,motionTime:i*.1*(1+stress*3.6),weights,stress,width:1000,pointer:{x:.4}},2);}const b=await audio.ctx.startRendering(),l=b.getChannelData(0),r=b.getChannelData(1);let peak=0,power=0,stereo=0;for(let i=0;i<l.length;i++){if(!Number.isFinite(l[i])||!Number.isFinite(r[i]))throw Error('Nonfinite audio');peak=Math.max(peak,Math.abs(l[i]),Math.abs(r[i]));power+=l[i]**2+r[i]**2;stereo+=(l[i]-r[i])**2;}if(!(peak>.001&&peak<.8&&power>0&&stereo>1e-5))throw Error('Silent/clipped/mono '+name);results.push(name+' PASS peak '+peak.toFixed(4)+' rms '+Math.sqrt(power/(l.length*2)).toFixed(4)+' stereo '+stereo.toFixed(4));}document.querySelector('#result').textContent=results.join('\n');}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}finally{window.AudioContext=Native;}
</script></html>
