<!doctype html><html lang="en"><meta charset="utf-8"><title>Abyssal audio verification</title><pre id="result">Rendering calm, strike and captured sound…</pre><script type="module">
import {CreatureAudio} from '/experiments/abyssal/v3/audio.mjs';
const Native=window.AudioContext;
class TestContext extends OfflineAudioContext{constructor(){super(2,44100*4,44100);this.scheduleTime=0;}get state(){return 'running';}get currentTime(){return this.scheduleTime;}resume(){return Promise.resolve();}}
window.AudioContext=TestContext;
try{
 const results=[];
 for(const mode of ['STALK','STRIKE','CAUGHT']){
  const audio=new CreatureAudio();await audio.enable();for(let i=0;i<40;i++){audio.ctx.scheduleTime=i*.1;audio.update({time:i*.1,mode,caught:mode==='CAUGHT',width:1000,body:{x:500+Math.sin(i*.1)*150,speed:mode==='STALK'?20:160}});}
  const b=await audio.ctx.startRendering(),l=b.getChannelData(0),r=b.getChannelData(1);let peak=0,power=0,stereo=0;
  for(let i=0;i<l.length;i++){if(!Number.isFinite(l[i])||!Number.isFinite(r[i]))throw Error('Nonfinite audio');peak=Math.max(peak,Math.abs(l[i]),Math.abs(r[i]));power+=l[i]*l[i]+r[i]*r[i];stereo+=(l[i]-r[i])**2;}
  if(!(peak>.001&&peak<.8&&power>0&&stereo>1e-5))throw Error('Silent, clipped or mono output');results.push(`${mode} PASS / peak ${peak.toFixed(4)} / rms ${Math.sqrt(power/(l.length*2)).toFixed(4)} / stereo ${stereo.toFixed(4)}`);
 }
 document.querySelector('#result').textContent=results.join('\n')+'\nAll three actual audio graphs rendered with procedural updates.';
}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}finally{window.AudioContext=Native;}
</script></html>
