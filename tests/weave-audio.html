<!doctype html><html lang="en"><meta charset="utf-8"><title>Weave audio verification</title><pre id="result">Rendering elastic audio graphs…</pre><script type="module">
import {buildWeaveAudio} from '/experiments/weave/v1/audio.mjs';
const states=[{name:'rest',x:.5,y:.5,dwell:0,knot:0,energy:0,waveEnergy:0},{name:'soft left wave',x:.12,y:.25,dwell:.45,knot:0,energy:.18,waveEnergy:.3},{name:'deep right wave',x:.88,y:.78,dwell:1,knot:0,energy:.62,waveEnergy:.8},{name:'distorted knot',x:.64,y:.4,dwell:1,knot:1,energy:.9,waveEnergy:.9}],results=[];
for(const state of states){const ctx=new OfflineAudioContext(2,48000*5,48000),graph=buildWeaveAudio(ctx);graph.master.gain.value=.35;for(let t=0;t<3;t+=1/30)graph.update({...state,time:t},t);graph.update({x:state.x,y:state.y,time:3,dwell:0,knot:0,energy:0,waveEnergy:0},3);const b=await ctx.startRendering(),l=b.getChannelData(0),r=b.getChannelData(1);let peak=0,power=0,stereo=0,tail=0,crossings=0;for(let i=1;i<l.length;i++){peak=Math.max(peak,Math.abs(l[i]),Math.abs(r[i]));power+=l[i]*l[i];stereo+=Math.abs(l[i]-r[i]);if(i>48000*3.7)tail+=Math.abs(l[i]);if(i>48000&&i<48000*2.5&&Math.sign(l[i])!==Math.sign(l[i-1]))crossings++;}results.push({...state,peak,rms:Math.sqrt(power/l.length),stereo:stereo/l.length,tail:tail/(48000*1.3),crossings});graph.dispose();}
document.querySelector('#result').textContent=JSON.stringify({results,pass:results[0].rms<results[1].rms*.25&&results[2].rms>results[1].rms*1.15&&results[3].rms>results[2].rms&&results[1].stereo>.00001&&results[3].tail>.0001&&results[2].crossings>results[1].crossings*1.25&&results.slice(1).every(r=>r.peak>.001&&r.peak<.8)},null,2);
</script></html>
