<!doctype html><html lang="en"><meta charset="utf-8"><title>Talisman QA</title><style>body{font:12px monospace;background:#ddd}iframe{border:0;width:800px;height:700px}pre{white-space:pre-wrap}button{padding:8px}</style><button id="run">Run interaction checks</button><button id="mobile">Mobile layout</button><pre id="result">Loading…</pre><iframe id="art" src="/experiments/abyssal/v2/"></iframe><script type="module">
const frame=document.querySelector('#art'),out=document.querySelector('#result');const sleep=ms=>new Promise(r=>setTimeout(r,ms));
frame.onload=()=>{const s=frame.contentDocument.createElement('script');s.type='module';s.textContent="import {snapshot} from '/experiments/abyssal/v2/main.mjs'; window.labSnapshot=snapshot;";frame.contentDocument.body.append(s);out.textContent='Ready. Camera hardware is not used by these checks.';};
document.querySelector('#run').onclick=async()=>{const w=frame.contentWindow,c=frame.contentDocument.querySelector('canvas'),results=[],check=(name,ok)=>results.push((ok?'PASS ':'FAIL ')+name),get=()=>w.labSnapshot(),key=k=>c.dispatchEvent(new w.KeyboardEvent('keydown',{key:k,bubbles:true}));
try{check('Same six arms / 150 links',get().arms===6&&get().nodes===150);check('Only webcam button',frame.contentDocument.querySelectorAll('button').length===1);let a=get();await sleep(350);check('Simulation advances',get().time>a.time);key('p');a=get();await sleep(300);check('Pause freezes simulation',get().paused&&get().time===a.time);key('p');await sleep(120);check('Resume',!get().paused&&get().time>a.time);
const body=get().body;w.dispatchEvent(new w.CustomEvent('lab-hand',{detail:{tracked:true,fist:true,x:body.x/get().width*2-1,y:body.y/get().height*2-1}}));await sleep(400);check('Fist captures creature',get().caught&&get().pointer.down&&get().mode==='CAUGHT');check('Constraints remain stable',get().stretch<.08);w.dispatchEvent(new w.CustomEvent('lab-hand',{detail:{tracked:true,fist:false,x:body.x/get().width*2-1,y:body.y/get().height*2-1}}));await sleep(100);check('Open hand releases and scares',!get().caught&&get().mode==='ESCAPE');w.dispatchEvent(new w.CustomEvent('lab-hand',{detail:{tracked:false,fist:false}}));check('Tracking loss releases',!get().hand&&!get().pointer.down);
// Synthetic touch exercises the actual handlers, with capture stubbed because no OS contact exists.
const capture=c.setPointerCapture;c.setPointerCapture=()=>{};const p=get().body;c.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:900,pointerType:'touch',clientX:p.x,clientY:p.y,bubbles:true}));check('Touch hold catches',get().caught);c.dispatchEvent(new w.PointerEvent('pointercancel',{pointerId:900,pointerType:'touch',bubbles:true}));check('Touch cancellation releases',!get().caught);c.setPointerCapture=capture;
key('p');out.textContent=results.join('\n')+'\n'+JSON.stringify(get());}catch(e){out.textContent=results.join('\n')+'\nERROR '+e.stack;}};
document.querySelector('#mobile').onclick=async()=>{frame.style.width='390px';frame.style.height='740px';await sleep(400);const d=frame.contentDocument,b=d.querySelector('button').getBoundingClientRect(),s=frame.contentWindow.labSnapshot();out.textContent='Mobile: '+JSON.stringify(s)+'\nWebcam button inside viewport: '+(b.right<=390&&b.bottom<=740)+'\nNo page overflow: '+(d.documentElement.scrollWidth===390);};
</script></html>
