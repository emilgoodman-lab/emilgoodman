<!doctype html><html lang="en"><meta charset="utf-8"><title>Strata III audio verification</title><pre id="result">Rendering sand and wind audio graphs…</pre><script type="module">
import {buildStrataAudio} from '/experiments/strata/v3/audio.mjs';
const states=[
 {name:'rest',activity:0,collisionActivity:0,sweepActivity:0,windActivity:0,windStrength:0,windPan:0,contacts:0,moving:0},
 {name:'light sweep',activity:.22,collisionActivity:.14,sweepActivity:.3,windActivity:0,windStrength:0,windPan:-.35,contacts:260,moving:420},
 {name:'dense sweep',activity:.82,collisionActivity:.8,sweepActivity:.9,windActivity:0,windStrength:0,windPan:.3,contacts:6700,moving:1800},
 {name:'left turbine',activity:1,collisionActivity:.75,sweepActivity:.6,windActivity:.95,windStrength:.92,windPan:-.85,contacts:15000,moving:2980},
 {name:'right turbine',activity:1,collisionActivity:.75,sweepActivity:.6,windActivity:.95,windStrength:.92,windPan:.85,contacts:15000,moving:2980}
],results=[];
for(const state of states){const rate=48000,ctx=new OfflineAudioContext(2,rate*5,rate),graph=buildStrataAudio(ctx);graph.master.gain.value=.5;for(let t=0;t<3;t+=1/30)graph.update({...state,time:t},t);graph.update({...states[0],time:3},3);const buffer=await ctx.startRendering(),left=buffer.getChannelData(0),right=buffer.getChannelData(1);let peak=0,leftPower=0,rightPower=0,stereo=0,tail=0;for(let i=0;i<left.length;i++){peak=Math.max(peak,Math.abs(left[i]),Math.abs(right[i]));leftPower+=left[i]*left[i];rightPower+=right[i]*right[i];stereo+=Math.abs(left[i]-right[i]);if(i>rate*3.7)tail+=(Math.abs(left[i])+Math.abs(right[i]))*.5;}results.push({name:state.name,peak,leftRms:Math.sqrt(leftPower/left.length),rightRms:Math.sqrt(rightPower/right.length),rms:Math.sqrt((leftPower+rightPower)/(left.length*2)),stereo:stereo/left.length,tail:tail/(rate*1.3)});graph.dispose();}
const [rest,light,dense,left,right]=results;const pass=rest.rms<.00001&&light.rms>.0001&&dense.rms>light.rms*1.15&&left.rms>dense.rms*.7&&right.rms>dense.rms*.7&&left.leftRms>left.rightRms&&right.rightRms>right.leftRms&&left.stereo>.0001&&right.stereo>.0001&&left.tail>.000005&&results.slice(1).every(r=>r.peak>.001&&r.peak<.95);
document.querySelector('#result').textContent=JSON.stringify({results,pass},null,2);
</script></html>
