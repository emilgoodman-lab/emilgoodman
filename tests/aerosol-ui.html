<!doctype html><html lang="en"><meta charset="utf-8"><title>Aerosol I synthetic input verification</title><button id="run">Run synthetic hand and keyboard test</button><pre id="result">Ready. This test supplies synthetic input, not camera footage.</pre><iframe title="Aerosol I test" src="/experiments/aerosol/v1/" style="width:900px;height:650px;border:0"></iframe><script type="module">
const frame=document.querySelector('iframe'),wait=ms=>new Promise(r=>setTimeout(r,ms)),number=(text,label)=>Number(text.match(new RegExp(`${label}\\s*=\\s*(\\d+)`))?.[1]||0),shade=text=>Number(text.match(/shade\s*=\s*(\d+)%/)?.[1]||0);document.querySelector('#run').onclick=async()=>{const win=frame.contentWindow,doc=frame.contentDocument,results=[],send=(tracked,fist=false,x=0,y=0)=>win.dispatchEvent(new CustomEvent('lab-hand',{detail:{tracked,fist,x,y}}));send(true,false,0,-.1);await wait(300);results.push({input:'open hand aims',mode:doc.querySelector('#mode').textContent,inverted:doc.querySelector('main').classList.contains('inverted')});send(true,true,0,-.1);await wait(1400);const first=doc.querySelector('#readout').textContent;results.push({input:'fist sprays',marks:number(first,'marks'),shade:shade(first),inverted:doc.querySelector('main').classList.contains('inverted')});send(true,false,0,-.1);await wait(500);results.push({input:'open hand dries',mode:doc.querySelector('#mode').textContent,inverted:doc.querySelector('main').classList.contains('inverted')});send(true,true,.3,.15);await wait(500);const second=doc.querySelector('#readout').textContent;results.push({input:'new fist new gray',shade:shade(second),inverted:doc.querySelector('main').classList.contains('inverted')});send(false);const canvas=doc.querySelector('#aerosol');canvas.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));await wait(400);results.push({input:'space sprays',mode:doc.querySelector('#mode').textContent,inverted:doc.querySelector('main').classList.contains('inverted')});win.dispatchEvent(new KeyboardEvent('keyup',{key:' '}));await wait(100);const pass=results.every(r=>!r.inverted)&&results[0].mode==='NOZZLE LEAK / DRY'&&results[1].marks>50&&Math.abs(results[1].shade-results[3].shade)>=20&&results[4].mode==='FAULTY SPRAY / WET';document.querySelector('#result').textContent=JSON.stringify({results,pass},null,2);};
</script></html>
