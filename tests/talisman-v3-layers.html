<!doctype html><html><meta charset="utf-8"><title>Paper arcades layer test</title><pre id="result">Testing transparent openings…</pre><script type="module">
import {makeCollage} from '/experiments/abyssal/v3/collage.mjs';import {buildHabitat} from '/experiments/abyssal/v3/habitat.mjs';
try{const skin=await makeCollage(),results=[];for(const [width,height] of [[1280,720],[390,740]]){const h=buildHabitat(width,height,skin,1),ctx=h.front.getContext('2d'),data=ctx.getImageData(0,0,width,height).data;let clear=0,opaque=0;for(let i=3;i<data.length;i+=4){if(data[i]===0)clear++;if(data[i]>250)opaque++;}if(!(clear/(width*height)>.72&&opaque>1000))throw Error('Solid layer or missing foreground');const c=document.createElement('canvas');c.width=width;c.height=height;const s=c.getContext('2d');s.fillStyle='#00ff00';s.fillRect(0,0,width,height);s.drawImage(h.front,0,0);const out=s.getImageData(0,0,width,height).data;let hidden=0,visible=0;for(let i=0;i<data.length;i+=4){if(data[i+3]>250&&out[i+1]!==255)hidden++;if(data[i+3]===0&&out[i+1]===255)visible++;}if(hidden<1000||visible<width*height*.72)throw Error('Occlusion composite incorrect');results.push('PASS '+width+'px: foreground occludes; '+(clear/(width*height)*100).toFixed(1)+'% clear openings');}document.querySelector('#result').textContent=results.join('\n');}catch(e){document.querySelector('#result').textContent='FAIL '+e.stack;}
</script></html>
