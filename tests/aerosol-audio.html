<!doctype html><html lang="en"><meta charset="utf-8"><title>Aerosol I audio verification</title><pre id="result">Rendering leak, spray and broken-nozzle audio…</pre><script type="module">
import {buildAerosolAudio} from '/experiments/aerosol/v1/audio.mjs';
const states=[{name:'idle leak',spraying:false,pressure:0,sputter:.06,leakActivity:.65,pointer:{x:450},width:900},{name:'soft spray',spraying:true,pressure:.72,sputter:.2,leakActivity:.1,pointer:{x:180},width:900},{name:'broken spray',spraying:true,pressure:1,sputter:.95,leakActivity:.1,pointer:{x:720},width:900}],results=[];
for(const state of states){const rate=48000,ctx=new OfflineAudioContext(2,rate*4,rate),graph=buildAerosolAudio(ctx);graph.master.gain.value=.5;for(let t=0;t<2.8;t+=1/30)graph.update({...state,time:t},t);graph.update({...states[0],time:2.8},2.8);const buffer=await ctx.startRendering(),left=buffer.getChannelData(0),right=buffer.getChannelData(1);let peak=0,power=0,stereo=0,tail=0;for(let i=0;i<left.length;i++){peak=Math.max(peak,Math.abs(left[i]),Math.abs(right[i]));power+=left[i]*left[i]+right[i]*right[i];stereo+=Math.abs(left[i]-right[i]);if(i>rate*3.2)tail+=(Math.abs(left[i])+Math.abs(right[i]))*.5;}results.push({name:state.name,peak,rms:Math.sqrt(power/(left.length*2)),stereo:stereo/left.length,tail:tail/(rate*.8)});graph.dispose();}
const [idle,soft,broken]=results;const pass=idle.rms>.00001&&idle.rms<soft.rms*.3&&soft.rms>.001&&broken.rms>soft.rms*.9&&broken.stereo>.0001&&broken.tail>.000001&&results.every(r=>r.peak<.95);document.querySelector('#result').textContent=JSON.stringify({results,pass},null,2);
</script></html>
