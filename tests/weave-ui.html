<!doctype html><html lang="en"><meta charset="utf-8"><title>Weave synthetic hand verification</title><style>body{margin:0;background:#aaa;font:11px monospace}button{margin:3px}iframe{width:100%;height:700px;border:0}pre{white-space:pre-wrap}</style><button id="open">Open hand wave</button><button id="fist">Hold fist knot</button><button id="release">Release tracking</button><button id="run">Run state sequence</button><pre id="result">Synthetic hand events; camera is not used.</pre><iframe id="art" src="/experiments/weave/v1/"></iframe><script type="module">
const frame=document.querySelector('#art'),wait=ms=>new Promise(r=>setTimeout(r,ms)),send=(tracked,fist=false,x=.08,y=-.04)=>frame.contentWindow.dispatchEvent(new CustomEvent('lab-hand',{detail:{tracked,fist,x,y}}));open.onclick=()=>send(true,false);fist.onclick=()=>send(true,true);release.onclick=()=>send(false);run.onclick=async()=>{const doc=frame.contentDocument,states=[];send(true,false);await wait(1200);states.push({name:'open wave',inverted:doc.querySelector('main').classList.contains('inverted'),status:doc.querySelector('#mode').textContent,readout:doc.querySelector('#readout').textContent});send(true,true);await wait(850);states.push({name:'fist held',inverted:doc.querySelector('main').classList.contains('inverted'),status:doc.querySelector('#mode').textContent});send(true,true);await wait(300);states.push({name:'fist sustained',inverted:doc.querySelector('main').classList.contains('inverted')});send(true,false);await wait(180);states.push({name:'hand open',inverted:doc.querySelector('main').classList.contains('inverted')});send(false);await wait(120);states.push({name:'tracking lost',inverted:doc.querySelector('main').classList.contains('inverted')});result.textContent=JSON.stringify({synthetic:true,states,pass:states.map(s=>Number(s.inverted)).join('')==='01100'&&states[0].readout.includes('input   = HAND')},null,2);};
</script></html>
