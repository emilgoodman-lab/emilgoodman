<!doctype html><html lang="en"><meta charset="utf-8"><title>Rotor audio verification</title><pre id="result">Rendering actual audio graphs…</pre><script type="module">
import {buildResonator} from '/experiments/rotor/v1/audio.mjs';
const results=[];
for(const stress of [0,1]){const ctx=new OfflineAudioContext(2,48000*6,48000),graph=buildResonator(ctx);graph.master.gain.value=.35;for(let t=0;t<4;t+=.1)graph.update({time:t,weights:[.4,.7,.5,.6],stress,mirror:3},t);graph.master.gain.setTargetAtTime(0,5,.15);const buffer=await ctx.startRendering(),l=buffer.getChannelData(0),r=buffer.getChannelData(1);let peak=0,power=0,stereo=0,late=0;for(let i=0;i<l.length;i++){peak=Math.max(peak,Math.abs(l[i]),Math.abs(r[i]));power+=l[i]*l[i];stereo+=Math.abs(l[i]-r[i]);if(i>48000*4.5)late+=Math.abs(l[i]);}results.push({stress,peak,rms:Math.sqrt(power/l.length),stereo:stereo/l.length,late:late/72000,pass:Number.isFinite(peak)&&peak>.001&&peak<.95&&stereo>1&&late>1});graph.dispose();}
document.querySelector('#result').textContent=JSON.stringify(results,null,2);
</script></html>
