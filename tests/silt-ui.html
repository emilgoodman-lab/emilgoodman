<!doctype html><html lang="en"><meta charset="utf-8"><title>Silt synthetic input verification</title><button id="run">Run synthetic hand and keyboard test</button><pre id="result">Ready. This test supplies synthetic input, not camera footage.</pre><iframe title="Silt test" src="/experiments/silt/v1/" style="width:900px;height:650px;border:0"></iframe><script type="module">
const frame=document.querySelector('iframe'),wait=ms=>new Promise(r=>setTimeout(r,ms));document.querySelector('#run').onclick=async()=>{const win=frame.contentWindow,doc=frame.contentDocument,results=[];const send=(tracked,fist=false,x=0,y=.85)=>win.dispatchEvent(new CustomEvent('lab-hand',{detail:{tracked,fist,x,y}}));send(true,false);await wait(1000);results.push({input:'open hand',inverted:doc.querySelector('main').classList.contains('inverted'),readout:doc.querySelector('#readout').textContent});send(true,true);await wait(700);results.push({input:'fist held',inverted:doc.querySelector('main').classList.contains('inverted')});send(true,true);await wait(250);results.push({input:'fist still held',inverted:doc.querySelector('main').classList.contains('inverted')});send(true,false);await wait(100);results.push({input:'hand opened',inverted:doc.querySelector('main').classList.contains('inverted')});send(true,true);send(false);await wait(100);results.push({input:'tracking lost',inverted:doc.querySelector('main').classList.contains('inverted')});const canvas=doc.querySelector('#silt');canvas.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));await wait(100);results.push({input:'space held',inverted:doc.querySelector('main').classList.contains('inverted')});win.dispatchEvent(new KeyboardEvent('keyup',{key:' '}));await wait(100);results.push({input:'space released',inverted:doc.querySelector('main').classList.contains('inverted')});document.querySelector('#result').textContent=JSON.stringify({synthetic:true,results,pass:results.map(r=>Number(r.inverted)).join('')==='0110010'},null,2);};
</script></html>
