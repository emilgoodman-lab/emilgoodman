<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f3ef"><title>AEROSOL I — FAULTY NOZZLE</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='28'%3E%E2%A8%B3%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script type="module" src="./main.mjs"></script><script type="module" src="./camera.js"></script></head><body><main>
<header><span>⨳</span><strong>INTERACTIVE VISUAL LAB</strong><span>AEROSOL.I</span></header>
<div class="toolbar"><h1>AEROSOL I / FAULTY NOZZLE</h1><div class="buttons"><button id="sound" aria-pressed="false">[ SOUND ]</button><label class="volume">VOL<input id="volume" aria-label="Aerosol volume" type="range" min="0" max="1" step=".05" value=".5"></label><label class="brush">BRUSH<input id="brush" aria-label="Brush size" type="range" min="18" max="150" step="1" value="72"><output id="brush-value">72 PX</output></label><button id="camera-toggle" aria-pressed="false">[ ENABLE WEBCAM ]</button><button id="pause" aria-pressed="false">[ PAUSE ]</button></div></div>
<canvas id="aerosol" tabindex="0" aria-label="A white ASCII paint surface. Move to aim. Hold the pointer, touch, Space, or close a tracked fist to spray a dense irregular glyph cloud. Every new hold chooses a distinctly different gray. Sustained spray saturates the paint until it drips; release lets the flow stop and dry. The idle nozzle leaks faint falling glyph particles. Arrow keys move the nozzle and P pauses."></canvas>
<aside class="readout-panel"><div class="panel-title">⨳ NOZZLE / LIVE</div><pre id="readout" aria-label="Live aerosol simulation">Preparing paint field…</pre></aside>
<aside class="camera-panel"><div class="panel-title">⨳ HAND / 2-BIT</div><div class="camera-image"><canvas id="camera-pixels" width="128" height="96" aria-label="Monochrome pixel webcam preview"></canvas><span id="camera-placeholder">CAMERA OFF</span></div><p id="camera-status" data-open="TRACKING / OPEN / AIM" data-fist="TRACKING / FIST / SPRAY" role="status">OPEN: AIM / FIST: SPRAY</p><div class="camera-note">LOCAL ONLY · NO RECORDING</div></aside>
<div class="statusbar"><span id="mode">NOZZLE LEAK / DRY</span><span class="hint">MOVE TO AIM · HOLD TO SPRAY · DWELL TO DRIP</span><span>ASCII PAINT / EG</span></div><noscript>Enable JavaScript to enter the paint field.</noscript></main></body></html>
