<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>STRATA I — SAND TABLE</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='28' fill='white'%3E⨳%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script type="module" src="./main.mjs"></script><script type="module" src="./camera.js"></script></head><body><main>
<header><span>⨳</span><strong>INTERACTIVE VISUAL LAB</strong><span>STRATA.I</span></header>
<div class="toolbar"><h1>STRATA I / SAND TABLE</h1><div class="buttons"><button id="sound" aria-pressed="false">[ SOUND ]</button><label class="volume">VOL<input id="volume" aria-label="Strata volume" type="range" min="0" max="1" step=".05" value=".5"></label><button id="camera-toggle" aria-pressed="false">[ ENABLE WEBCAM ]</button><button id="pause" aria-pressed="false">[ PAUSE ]</button></div></div>
<canvas id="strata" tabindex="0" aria-label="Three independent layers of one thousand colliding glyph grains form a sand-covered table. Sweep with the mouse, touch, or an open tracked hand. Hold the pointer or close the fist for an inverted multidirectional turbulent wind. Arrow keys move the broom, hold Space for wind, P pauses."></canvas>
<aside class="readout-panel"><div class="panel-title">⨳ SAND / LIVE</div><pre id="readout" aria-label="Live layered sand simulation">Preparing 3000 grains…</pre></aside>
<aside class="camera-panel"><div class="panel-title">⨳ HAND / 2-BIT</div><div class="camera-image"><canvas id="camera-pixels" width="128" height="96" aria-label="Monochrome pixel webcam preview"></canvas><span id="camera-placeholder">CAMERA OFF</span></div><p id="camera-status" role="status">OPEN: SWEEP / HOLD FIST: WIND</p><div class="camera-note">LOCAL ONLY · NO RECORDING</div></aside>
<div class="statusbar"><span id="mode">TABLE REST</span><span class="hint">MOVE TO SWEEP · HOLD FOR TURBINE</span><span>3 × 1000 / EG</span></div><noscript>Enable JavaScript to enter the table.</noscript></main></body></html>
