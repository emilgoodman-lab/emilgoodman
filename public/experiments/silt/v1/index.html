<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080808"><title>SILT — GRANULAR MATTER</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='25' font-size='28' fill='white'%3E⠿%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="./style.css"><script type="module" src="./main.mjs"></script><script type="module" src="./camera.js"></script></head><body><main>
<header><span>▣</span><strong>INTERACTIVE VISUAL LAB</strong><span>SILT.EXE</span></header>
<div class="toolbar"><h1>SILT / GRANULAR MATTER</h1><div class="buttons"><button id="sound" aria-pressed="false">[ SOUND ]</button><label class="volume">VOL<input id="volume" aria-label="Silt volume" type="range" min="0" max="1" step=".05" value=".5"></label><button id="camera-toggle" aria-pressed="false">[ ENABLE WEBCAM ]</button><button id="pause" aria-pressed="false">[ PAUSE ]</button></div></div>
